plugins {
    id 'groovy'
    id("io.micronaut.build.internal.problem-json-tests")
}

dependencies {
    testCompileOnly(mnValidation.micronaut.validation.processor)
    testCompileOnly mn.micronaut.inject.groovy
    testImplementation mnValidation.micronaut.validation
    testImplementation mnTest.micronaut.test.spock
    testImplementation projects.micronautProblemJson
    testImplementation mn.micronaut.http.server.netty
    testImplementation mn.micronaut.http.client
    testRuntimeOnly(mn.snakeyaml)
    testImplementation(mnSerde.micronaut.serde.jackson)
}

tasks.named('test') {
    useJUnitPlatform()
}
//TODO remove once Micronaut Test ships Spock version compatible with Groovy 5
configurations.all {
    resolutionStrategy {
        force("org.spockframework:spock-core:2.4-M7-groovy-5.0")
    }
}
